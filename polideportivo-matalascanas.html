function getSlotsForGroup(group) {
  return group === "karting" ? KARTING_HOURS : HOURS;
}

function formatHourLabel(h) {
  const wrapped = h % 24;
  const hh = Math.floor(wrapped);
  const mm = Math.round((wrapped - hh) * 60);
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

function isKartingInSeason(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const start = new Date(y, 5, 1); // 1 de junio
  const end = new Date(y, 9, 1); // 1 de octubre
  return date >= start && date <= end;
}

function slotDateTime(dateStr, hour) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d, hour, 0, 0, 0);
}
function hoursUntil(dateStr, hour) {
  return (slotDateTime(dateStr, hour).getTime() - Date.now()) / 3600000;
}
function fmtEuro(n) {
  return `${(n || 0).toFixed(2).replace(".", ",")} €`;
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const BOOKING_WINDOW_DAYS = 14; // hoy + 13 días más = 14 días reservables en total

function isDateBookable(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const maxDate = new Date(today);
  maxDate.setDate(maxDate.getDate() + (BOOKING_WINDOW_DAYS - 1));
  return date >= today && date <= maxDate;
}

  useEffect(() => {
    (async () => {
      try {
        const [profRes, bookRes, fsRes, wtRes] = await Promise.all([
          sb.from("profiles").select("*"),
          sb.from("bookings").select("*"),
          sb.from("facility_status").select("*"),
          sb.from("wallet_tx").select("*"),
        ]);
        if (profRes.error) throw profRes.error;
        if (bookRes.error) throw bookRes.error;
        if (fsRes.error) throw fsRes.error;
        if (wtRes.error) throw wtRes.error;

        let loadedUsers = (profRes.data || []).map(mapUserRow);
        const hasAdmin = loadedUsers.some((usr) => usr.username.toLowerCase() === ADMIN_USERNAME);
        if (!hasAdmin) {
          const adminRow = {
            username: ADMIN_USERNAME,
            password: obfuscate(ADMIN_DEFAULT_PASSWORD),
            name: "Administración",
            phone: "",
            email: null,
            email_verified: true,
            role: "admin",
            balance: 0,
          };
          const { data: inserted, error: insErr } = await sb.from("profiles").insert(adminRow).select().single();
          if (!insErr && inserted) loadedUsers = [...loadedUsers, mapUserRow(inserted)];
        }
        setUsers(loadedUsers);
        setBookings((bookRes.data || []).map(mapBookingRow));
        const fsMap = {};
        (fsRes.data || []).forEach((r) => { fsMap[r.facility_id] = r.active; });
        setFacilityStatus(fsMap);
        setWalletTx((wtRes.data || []).map(mapWalletRow));
      } catch (e) {
        console.error(e);
        setToast("No se pudo conectar con la base de datos. Comprueba tu conexión e inténtalo de nuevo.");
      }
      setLoading(false);
    })();
  }, []);

  // Tiempo real: cuando otra persona reserva/cancela o el admin marca una avería,
  // todo el mundo con la web abierta lo ve reflejado al instante.
  useEffect(() => {
    const channel = sb
      .channel("poli-mata-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, async () => {
        const { data, error } = await sb.from("bookings").select("*");
        if (!error) setBookings((data || []).map(mapBookingRow));
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "facility_status" }, async () => {
        const { data, error } = await sb.from("facility_status").select("*");
        if (!error) {
          const fsMap = {};
          (data || []).forEach((r) => { fsMap[r.facility_id] = r.active; });
          setFacilityStatus(fsMap);
        }
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, []);

  useEffect(() => {
    if (!currentUser) {
      setView("login");
      return;
    }
    let deepLink = null;
    try {
      deepLink = new URLSearchParams(window.location.search).get("actividad");
    } catch {}
    if (deepLink && GROUPS.some((g) => g.id === deepLink) && (currentUser.role === "admin" || currentUser.emailVerified)) {
      setView("reservar");
    } else {
      setView("inicio");
    }
  }, [currentUser]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  }

  function getBalance(username) {
    const u = users.find((x) => x.username === username);
    return u?.balance || 0;
  }

  async function adjustBalance(username, delta, type, note) {
    const u = users.find((x) => x.username === username);
    if (!u) return;
    const newBalance = Math.round(((u.balance || 0) + delta) * 100) / 100;
    const { error } = await sb.from("profiles").update({ balance: newBalance }).eq("username", username);
    if (error) {
      console.error(error);
      showToast("No se pudo actualizar el monedero. Inténtalo de nuevo.");
      return;
    }
    setUsers((prev) => prev.map((x) => (x.username === username ? { ...x, balance: newBalance } : x)));
    if (currentUser && currentUser.username === username) {
      setCurrentUser((prev) => ({ ...prev, balance: newBalance }));
    }
    const { data: txRow, error: txErr } = await sb
      .from("wallet_tx")
      .insert({ username, amount: delta, type, note: note || "" })
      .select()
      .single();
    if (!txErr && txRow) setWalletTx((prev) => [...prev, mapWalletRow(txRow)]);
  }

  async function adminAddBalance(username, amount, note) {
    if (!amount || amount <= 0) {
      showToast("Introduce un importe válido.");
      return;
    }
    await adjustBalance(username, amount, "topup", note || "Ingreso en efectivo en el polideportivo");
    showToast(`Saldo añadido a ${username}: ${fmtEuro(amount)}.`);
  }

  function isFacilityActive(facilityId) {
    const fac = FACILITIES.find((f) => f.id === facilityId);
    if (!fac) return false;
    if (Object.prototype.hasOwnProperty.call(facilityStatus, facilityId)) return facilityStatus[facilityId];
    return fac.active;
  }

  async function toggleFacility(facilityId) {
    const newActive = !isFacilityActive(facilityId);
    const { error } = await sb.from("facility_status").upsert({ facility_id: facilityId, active: newActive });
    if (error) {
      console.error(error);
      showToast("No se pudo actualizar la instalación. Inténtalo de nuevo.");
      return;
    }
    setFacilityStatus((prev) => ({ ...prev, [facilityId]: newActive }));
  }

  async function handleRegister(form) {
    setAuthError("");
    if (!form.username || !form.password || !form.name || !form.email) {
      setAuthError("Rellena nombre, usuario, email y contraseña.");
      return;
    }
    if (!isValidEmail(form.email)) {
      setAuthError("Introduce un email válido.");
      return;
    }
    if (users.some((u) => u.username.toLowerCase() === form.username.toLowerCase())) {
      setAuthError("Ese usuario ya existe.");
      return;
    }
    if (users.some((u) => (u.email || "").toLowerCase() === form.email.toLowerCase())) {
      setAuthError("Ya hay una cuenta registrada con ese email.");
      return;
    }
    const newUser = {
      username: form.username,
      password: obfuscate(form.password),
      name: form.name,
      phone: form.phone || "",
      email: form.email,
      emailVerified: false,
      verificationCode: genCode(),
      resetCode: null,
      role: "user",
      balance: 0,
    };
    const { error } = await sb.from("profiles").insert({
      username: newUser.username,
      password: newUser.password,
      name: newUser.name,
      phone: newUser.phone,
      email: newUser.email,
      email_verified: false,
      verification_code: newUser.verificationCode,
      role: "user",
      balance: 0,
    });
    if (error) {
      console.error(error);
      setAuthError(error.code === "23505" ? "Ese usuario o email ya existe." : "No se pudo crear la cuenta. Inténtalo de nuevo.");
      return;
    }
    setUsers((prev) => [...prev, newUser]);
    setCurrentUser(newUser);
  }

  function handleLogin(form) {
    setAuthError("");
    const u = users.find((u) => u.username.toLowerCase() === form.username.toLowerCase());
    if (!u || u.password !== obfuscate(form.password)) {
      setAuthError("Usuario o contraseña incorrectos.");
      return;
    }
    setCurrentUser(u);
  }

  function handleLogout() {
    setCurrentUser(null);
    setSelectedFacility(null);
  }

  async function verifyEmail(code) {
    if (!currentUser) return false;
    if (String(code || "").trim() !== String(currentUser.verificationCode || "")) {
      showToast("Código incorrecto. Revisa e inténtalo de nuevo.");
      return false;
    }
    const { error } = await sb.from("profiles").update({ email_verified: true }).eq("username", currentUser.username);
    if (error) {
      console.error(error);
      showToast("No se pudo verificar la cuenta. Inténtalo de nuevo.");
      return false;
    }
    const updated = { ...currentUser, emailVerified: true };
    setUsers((prev) => prev.map((u) => (u.username === currentUser.username ? updated : u)));
    setCurrentUser(updated);
    showToast("Cuenta verificada. ¡Bienvenido!");
    return true;
  }

  async function resendVerificationCode() {
    if (!currentUser) return;
    const code = genCode();
    const { error } = await sb.from("profiles").update({ verification_code: code }).eq("username", currentUser.username);
    if (error) { console.error(error); return; }
    const updated = { ...currentUser, verificationCode: code };
    setUsers((prev) => prev.map((u) => (u.username === currentUser.username ? updated : u)));
    setCurrentUser(updated);
    showToast("Nuevo código generado.");
  }

  async function requestPasswordReset(username, email) {
    const u = users.find(
      (x) => x.username.toLowerCase() === (username || "").toLowerCase() && (x.email || "").toLowerCase() === (email || "").toLowerCase()
    );
    if (!u) return null;
    const code = genCode();
    const { error } = await sb.from("profiles").update({ reset_code: code }).eq("username", u.username);
    if (error) { console.error(error); return null; }
    setUsers((prev) => prev.map((x) => (x.username === u.username ? { ...x, resetCode: code } : x)));
    return code;
  }

  async function resetPassword(username, code, newPassword) {
    const u = users.find((x) => x.username.toLowerCase() === (username || "").toLowerCase());
    if (!u || !u.resetCode || String(u.resetCode) !== String(code || "")) return false;
    const newHash = obfuscate(newPassword);
    const { error } = await sb.from("profiles").update({ password: newHash, reset_code: null }).eq("username", u.username);
    if (error) { console.error(error); return false; }
    setUsers((prev) => prev.map((x) => (x.username === u.username ? { ...x, password: newHash, resetCode: null } : x)));
    return true;
  }

  function isSlotTaken(facilityId, date, hour) {
    if (!isFacilityActive(facilityId)) return true;
    return bookings.some((b) => {
      if (b.date !== date || b.hour !== hour) return false;
      if (b.facilityId === facilityId) return true;
      const fac = FACILITIES.find((f) => f.id === facilityId);
      if (fac?.kind === "medio" && b.facilityId === "futbol_completo") return true;
      if (fac?.kind === "completo" && (b.facilityId === "futbol_medioA" || b.facilityId === "futbol_medioB")) return true;
      return false;
    });
  }

  function bookingAt(facilityId, date, hour) {
    const direct = bookings.find((b) => b.facilityId === facilityId && b.date === date && b.hour === hour);
    if (direct) return direct;
    const fac = FACILITIES.find((f) => f.id === facilityId);
    if (fac?.kind === "medio") {
      return bookings.find((b) => b.facilityId === "futbol_completo" && b.date === date && b.hour === hour);
    }
    if (fac?.kind === "completo") {
      return bookings.find(
        (b) => (b.facilityId === "futbol_medioA" || b.facilityId === "futbol_medioB") && b.date === date && b.hour === hour
      );
    }
    return undefined;
  }

  async function confirmBooking(pricingInfo, paymentMethod) {
    if (!confirmSlot) return;
    const { facilityId, date, hour } = confirmSlot;
    if (isSlotTaken(facilityId, date, hour)) {
      showToast("Esa franja ya se ha ocupado. Elige otra.");
      setConfirmSlot(null);
      return;
    }
    if (paymentMethod === "monedero" && getBalance(currentUser.username) < pricingInfo.total) {
      showToast("Saldo insuficiente en el monedero.");
      return;
    }
    const fac = FACILITIES.find((f) => f.id === facilityId);
    const row = {
      facility_id: facilityId,
      facility_label: fac.label,
      date,
      hour,
      username: currentUser.username,
      user_name: currentUser.name,
      pricing_breakdown: pricingInfo.breakdown,
      total: pricingInfo.total,
      duration_label: pricingInfo.durationLabel || null,
      payment_method: paymentMethod,
      paid: paymentMethod === "monedero",
    };
    const { data, error } = await sb.from("bookings").insert(row).select().single();
    if (error) {
      console.error(error);
      showToast("No se pudo guardar la reserva (puede que otra persona haya reservado esa franja justo antes).");
      setConfirmSlot(null);
      return;
    }
    setBookings((prev) => [...prev, mapBookingRow(data)]);
    if (paymentMethod === "monedero") {
      await adjustBalance(currentUser.username, -pricingInfo.total, "charge", `Reserva ${fac.label} ${date} ${hour}:00h`);
    }
    setConfirmSlot(null);
    const payPlace = fac.group === "karting" ? "en el propio karting (efectivo o tarjeta)" : "en el kiosko";
    showToast(
      paymentMethod === "monedero"
        ? `Reserva confirmada: ${fac.label}, ${hour}:00h. Pagada con monedero (${fmtEuro(pricingInfo.total)}).`
        : `Reserva confirmada: ${fac.label}, ${hour}:00h. Paga ${fmtEuro(pricingInfo.total)} ${payPlace}.`
    );
  }

  async function cancelBooking(id) {
    const booking = bookings.find((b) => b.id === id);
    if (!booking) return;
    if (hoursUntil(booking.date, booking.hour) < CANCEL_WINDOW_HOURS) {
      showToast(`No se puede cancelar: faltan menos de ${CANCEL_WINDOW_HOURS}h para la reserva.`);
      return;
    }
    const { error } = await sb.from("bookings").delete().eq("id", id);
    if (error) {
      console.error(error);
      showToast("No se pudo cancelar la reserva. Inténtalo de nuevo.");
      return;
    }
    setBookings((prev) => prev.filter((b) => b.id !== id));
    if (booking.paymentMethod === "monedero" && booking.paid) {
      await adjustBalance(booking.username, booking.total, "refund", `Reembolso reserva ${booking.facilityLabel} ${booking.date} ${booking.hour}:00h`);
      showToast(`Reserva cancelada. Se han devuelto ${fmtEuro(booking.total)} al monedero.`);
    } else {
      showToast("Reserva cancelada.");
    }
  }

  if (loading) {
    return (
      <div style={styles.loadingScreen}>
        <GlobalStyle />
        <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, letterSpacing: 2, color: PALETTE.arena }}>
          CARGANDO POLIDEPORTIVO…
        </div>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <GlobalStyle />
      <Header
        currentUser={currentUser}
        onLogout={handleLogout}
        view={view}
        setView={setView}
        isAdmin={currentUser?.role === "admin"}
        balance={currentUser ? getBalance(currentUser.username) : 0}
      />

      {!currentUser && (
        <AuthScreen
          authMode={authMode}
          setAuthMode={setAuthMode}
          authError={authError}
          onLogin={handleLogin}
          onRegister={handleRegister}
          onRequestReset={requestPasswordReset}
          onResetPassword={resetPassword}
        />
      )}

      {currentUser && currentUser.role !== "admin" && !currentUser.emailVerified && (
        <VerifyEmailScreen
          currentUser={currentUser}
          onVerify={verifyEmail}
          onResend={resendVerificationCode}
          onLogout={handleLogout}
        />
      )}

      {currentUser && (currentUser.role === "admin" || currentUser.emailVerified) && view === "inicio" && (
        <>
          <Scoreboard bookings={bookings} isFacilityActive={isFacilityActive} />
          <div style={{ textAlign: "center", padding: "8px 20px 36px" }}>
            <button style={styles.ctaBig} onClick={() => setView("reservar")}>
              Hacer una reserva
            </button>
          </div>
        </>
      )}

      {currentUser && (currentUser.role === "admin" || currentUser.emailVerified) && view === "reservar" && (
        <BookingFlow
          group={group}
          setGroup={setGroup}
          selectedDate={selectedDate}
          setSelectedDate={setSelectedDate}
          selectedFacility={selectedFacility}
          setSelectedFacility={setSelectedFacility}
          isSlotTaken={isSlotTaken}
          bookingAt={bookingAt}
          setConfirmSlot={setConfirmSlot}
          isFacilityActive={isFacilityActive}
        />
      )}

      {currentUser && (currentUser.role === "admin" || currentUser.emailVerified) && view === "misreservas" && (
        <MyBookings
          bookings={bookings.filter((b) => b.username === currentUser.username)}
          onCancel={cancelBooking}
          balance={getBalance(currentUser.username)}
        />
      )}

      {currentUser && currentUser.role === "admin" && view === "admin" && (
        <AdminPanel
          isFacilityActive={isFacilityActive}
          onToggle={toggleFacility}
          bookings={bookings}
          users={users.filter((u) => u.role !== "admin")}
          onAddBalance={adminAddBalance}
          walletTx={walletTx}
        />
      )}

      {confirmSlot && (
        <ConfirmModal
          slot={confirmSlot}
          onConfirm={confirmBooking}
          onCancel={() => setConfirmSlot(null)}
          balance={getBalance(currentUser.username)}
        />
      )}

      {toast && <div style={styles.toast}>{toast}</div>}

      <Footer />
    </div>
  );
}

   HEADER
--------------------------------------------------------- */

  return (
    <header
      style={{
        background: "rgba(58,90,112,0.94)",
        color: PALETTE.text,
        padding: "16px 20px",
        borderBottom: `3px solid ${PALETTE.blueDeep}`,
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <img src={LOGO_SRC} alt="Escudo C.D. Atlético Matalascañas" style={{ height: 46, width: "auto", borderRadius: "50%" }} />
          <div style={{ display: "flex", flexDirection: "column", lineHeight: 1 }}>

              POLIDEPORTIVO
            </span>
            <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 1, color: PALETTE.green }}>
              MATALASCAÑAS
            </span>
          </div>
        </div>
        {currentUser && (
          <nav style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>

                <NavBtn active={view === "reservar"} onClick={() => setView("reservar")}>Reservar</NavBtn>
                <NavBtn active={view === "misreservas"} onClick={() => setView("misreservas")}>Mis reservas</NavBtn>
              </>
            )}
            {isAdmin && <NavBtn active={view === "admin"} onClick={() => setView("admin")}>Admin</NavBtn>}
            {!isAdmin && currentUser.emailVerified && (
              <span
                style={{
                  fontSize: 12.5, fontWeight: 700, background: PALETTE.marisma, color: PALETTE.ink,
                  padding: "5px 10px", borderRadius: 20,
                }}

              >
                Monedero: {fmtEuro(balance)}

  return {
    fontFamily: "'Work Sans', sans-serif",
    fontSize: 13,
    fontWeight: 600,
    padding: "7px 14px",
    borderRadius: 20,
    border: "none",
    cursor: "pointer",

}
function NavBtn({ active, onClick, children }) {
  return <button onClick={onClick} style={navBtnStyle(active)}>{children}</button>;
}

/* ---------------------------------------------------------
   PANTALLA DE ACCESO
--------------------------------------------------------- */
function AuthScreen({ authMode, setAuthMode, authError, onLogin, onRegister, onRequestReset, onResetPassword }) {
  const [form, setForm] = useState({ username: "", password: "", name: "", phone: "", email: "" });

  function set(field, val) {
    setForm((f) => ({ ...f, [field]: val }));
  }

  function submit(e) {
    e.preventDefault();
    if (authMode === "login") onLogin(form);
    else onRegister(form);
  }

  return (
    <div style={{ maxWidth: 420, margin: "40px auto", padding: "0 20px" }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
        <img src={LOGO_SRC} alt="Escudo C.D. Atlético Matalascañas" style={{ height: 110, width: "auto" }} />
      </div>
      <div style={{ background: PALETTE.card, borderRadius: 14, padding: "28px 26px", boxShadow: "0 10px 30px rgba(18,56,71,0.1)" }}>
        {authMode !== "forgot" && (
          <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
            <TabBtn active={authMode === "login"} onClick={() => setAuthMode("login")}>Entrar</TabBtn>
            <TabBtn active={authMode === "register"} onClick={() => setAuthMode("register")}>Crear cuenta</TabBtn>
          </div>
        )}

        {authMode !== "forgot" && (
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {authMode === "register" && (
              <Input label="Nombre y apellidos" value={form.name} onChange={(v) => set("name", v)} />
            )}
            <Input label="Usuario" value={form.username} onChange={(v) => set("username", v)} />
            {authMode === "register" && (
              <Input label="Email" type="email" value={form.email} onChange={(v) => set("email", v)} />
            )}
            <Input label="Contraseña" type="password" value={form.password} onChange={(v) => set("password", v)} />
            {authMode === "register" && (
              <Input label="Teléfono (opcional)" value={form.phone} onChange={(v) => set("phone", v)} />
            )}
            {authError && <div style={{ color: PALETTE.averia, fontSize: 13 }}>{authError}</div>}
            <button type="submit" style={{ ...styles.ctaBig, marginTop: 6 }}>
              {authMode === "login" ? "Entrar" : "Crear cuenta"}
            </button>
            {authMode === "login" && (
              <button
                type="button"
                onClick={() => setAuthMode("forgot")}
                style={{ background: "none", border: "none", color: PALETTE.cardAccent, fontSize: 12.5, fontWeight: 600, cursor: "pointer", textAlign: "center", padding: 0 }}
              >
                ¿Has olvidado tu contraseña?
              </button>
            )}
          </form>
        )}

        {authMode === "forgot" && (
          <ForgotPasswordFlow
            onRequestReset={onRequestReset}
            onResetPassword={onResetPassword}
            onDone={() => setAuthMode("login")}
          />
        )}

        {authMode === "register" && (
          <p style={{ fontSize: 11.5, color: PALETTE.cardMuted, marginTop: 12, lineHeight: 1.5 }}>
            Te pediremos verificar tu email al crear la cuenta antes de poder reservar.
          </p>
        )}

        <p style={{ fontSize: 12, color: PALETTE.cardMuted, marginTop: 16, lineHeight: 1.5 }}>
          El acceso es solo para identificarte al reservar. El pago de la pista se hace siempre en efectivo, tarjeta o monedero en el kiosko del polideportivo.
        </p>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   RECUPERAR CONTRASEÑA
--------------------------------------------------------- */
function ForgotPasswordFlow({ onRequestReset, onResetPassword, onDone }) {
  const [step, setStep] = useState(1);
  const [username, setUsername] = useState("");
  const [email, setEmail] = useState("");
  const [demoCode, setDemoCode] = useState(null);
  const [code, setCode] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  async function requestCode() {
    setError("");
    if (!username || !email) {
      setError("Rellena usuario y email.");
      return;
    }
    const result = await onRequestReset(username, email);
    if (!result) {
      setError("No encontramos ninguna cuenta con ese usuario y email.");
      return;
    }
    setDemoCode(result);
    setStep(2);
  }

  async function submitReset() {
    setError("");
    if (!code || !newPassword) {
      setError("Introduce el código y la nueva contraseña.");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("Las contraseñas no coinciden.");
      return;
    }
    const ok = await onResetPassword(username, code, newPassword);
    if (!ok) {
      setError("Código incorrecto.");
      return;
    }
    setDone(true);
  }

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <p style={{ fontSize: 14, color: PALETTE.marisma, fontWeight: 600 }}>
          Contraseña actualizada correctamente. Ya puedes entrar con tu nueva contraseña.
        </p>
        <button type="button" onClick={onDone} style={styles.ctaBig}>Volver a entrar</button>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, letterSpacing: 1 }}>
        RECUPERAR CONTRASEÑA
      </div>

      {step === 1 && (
        <>
          <p style={{ fontSize: 12.5, color: PALETTE.cardMuted, lineHeight: 1.5 }}>
            Introduce tu usuario y el email con el que te registraste.
          </p>
          <Input label="Usuario" value={username} onChange={setUsername} />
          <Input label="Email" type="email" value={email} onChange={setEmail} />
          {error && <div style={{ color: PALETTE.averia, fontSize: 13 }}>{error}</div>}
          <button type="button" onClick={requestCode} style={styles.ctaBig}>Enviar código</button>
        </>
      )}

      {step === 2 && (
        <>
          <div style={{ background: "rgba(221,133,112,0.16)", border: `1px solid ${PALETTE.coralDeep}55`, borderRadius: 8, padding: 12, fontSize: 12.5, color: PALETTE.cardText, lineHeight: 1.5 }}>
            Esta web todavía no tiene servidor de correo propio, así que no te podemos enviar un email real todavía.
            Tu código de recuperación (simulado) es: <strong style={{ fontSize: 15 }}>{demoCode}</strong>
          </div>
          <Input label="Código de verificación" value={code} onChange={setCode} />
          <Input label="Nueva contraseña" type="password" value={newPassword} onChange={setNewPassword} />
          <Input label="Repite la contraseña" type="password" value={confirmPassword} onChange={setConfirmPassword} />
          {error && <div style={{ color: PALETTE.averia, fontSize: 13 }}>{error}</div>}
          <button type="button" onClick={submitReset} style={styles.ctaBig}>Cambiar contraseña</button>
        </>
      )}

      <button
        type="button"
        onClick={onDone}
        style={{ background: "none", border: "none", color: PALETTE.cardAccent, fontSize: 12.5, fontWeight: 600, cursor: "pointer", textAlign: "center", padding: 0 }}
      >
        Volver a entrar
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   MARCADOR (HERO / SIGNATURE)
--------------------------------------------------------- */
function Scoreboard({ bookings, isFacilityActive }) {
  const now = new Date();
  const today = fmtDate(now);
  const hour = now.getHours();

  const tiles = FACILITIES.map((f) => {
    let status = "libre";
    if (!isFacilityActive(f.id)) status = "averia";
    else {
      const taken = bookings.some((b) => {
        if (b.date !== today || b.hour !== hour) return false;
        if (b.facilityId === f.id) return true;
        if (f.kind === "medio" && b.facilityId === "futbol_completo") return true;
        if (f.kind === "completo" && (b.facilityId === "futbol_medioA" || b.facilityId === "futbol_medioB")) return true;
        return false;
      });
      if (taken) status = "ocupada";
    }
    return { ...f, status };
  });

  const statusColor = { libre: PALETTE.marisma, ocupada: PALETTE.ocre, averia: PALETTE.averia };
  const statusText = { libre: "LIBRE", ocupada: "OCUPADA", averia: "AVERÍA" };

  return (
    <div style={{ background: `linear-gradient(125deg, ${PALETTE.bg} 0%, ${PALETTE.bgSoft} 55%, #16232E 100%)`, padding: "26px 20px 30px" }}>
      <div style={{ maxWidth: 900, margin: "0 auto" }}>
        <div style={{ color: PALETTE.arena, fontFamily: "'Bebas Neue', sans-serif", fontSize: 15, letterSpacing: 2, marginBottom: 4, opacity: 0.8 }}>
          ESTADO DE PISTAS · AHORA {String(hour).padStart(2, "0")}:00
        </div>
        <div
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))",
            gap: 10,
          }}
        >
          {tiles.map((t) => (
            <div
              key={t.id}
              style={{
                background: PALETTE.card,
                borderRadius: 8,
                padding: "12px 10px",
                borderLeft: `4px solid ${statusColor[t.status]}`,
              }}
            >
              <div style={{ color: PALETTE.cardText, fontSize: 12.5, fontWeight: 600, minHeight: 32, lineHeight: 1.3 }}>
                {t.label}
              </div>
              <div
                style={{
                  fontFamily: "'Bebas Neue', sans-serif",
                  letterSpacing: 1,
                  color: statusColor[t.status],
                  fontSize: 18,
                  marginTop: 4,
                }}
              >
                {statusText[t.status]}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  useEffect(() => {

      const firstActive = facilitiesInGroup.find((f) => isFacilityActive(f.id));
      setSelectedFacility(firstActive ? firstActive.id : facilitiesInGroup[0]?.id ?? null);
    }

  const facility = FACILITIES.find((f) => f.id === selectedFacility);

          style={{
            height: 90,

            backgroundSize: "cover",
            backgroundPosition: "center",
            display: "flex",
            alignItems: "center",
            padding: "0 20px",
          }}

          <div style={{ color: "white", fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, letterSpacing: 0.5 }}>

              <div style={{ fontSize: 13, fontWeight: 700, color: PALETTE.cardAccent, letterSpacing: 0.5, marginBottom: 8, textTransform: "uppercase" }}>

/* ---------------------------------------------------------
   CALENDARIO MENSUAL
--------------------------------------------------------- */
const MESES_LARGO = [
  "enero", "febrero", "marzo", "abril", "mayo", "junio",
  "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
];
const DIAS_SEMANA = ["L", "M", "X", "J", "V", "S", "D"];

function MonthCalendar({ selectedDate, onSelect }) {
  const todayStr = fmtDate(new Date());
  const [y, m] = selectedDate.split("-").map(Number);
  const [viewYear, setViewYear] = useState(y);
  const [viewMonth, setViewMonth] = useState(m - 1); // 0-indexado

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  // lunes=0 ... domingo=6
  const startOffset = (firstOfMonth.getDay() + 6) % 7;

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) cells.push(day);

  function goPrevMonth() {
    let nm = viewMonth - 1, ny = viewYear;
    if (nm < 0) { nm = 11; ny -= 1; }
    setViewMonth(nm); setViewYear(ny);
  }
  function goNextMonth() {
    let nm = viewMonth + 1, ny = viewYear;
    if (nm > 11) { nm = 0; ny += 1; }
    setViewMonth(nm); setViewYear(ny);
  }

  return (
    <div style={{ marginBottom: 20, maxWidth: 300, marginLeft: "auto", marginRight: "auto" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <button
          type="button"
          onClick={goPrevMonth}
          style={{ border: `1px solid ${PALETTE.cardBorder}`, background: "transparent", color: PALETTE.cardText, borderRadius: 6, width: 24, height: 24, cursor: "pointer", fontSize: 13, lineHeight: 1 }}
        >
          ‹
        </button>
        <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 15, letterSpacing: 0.5 }}>
          {MESES_LARGO[viewMonth].toUpperCase()} {viewYear}
        </div>
        <button
          type="button"
          onClick={goNextMonth}
          style={{ border: `1px solid ${PALETTE.cardBorder}`, background: "transparent", color: PALETTE.cardText, borderRadius: 6, width: 24, height: 24, cursor: "pointer", fontSize: 13, lineHeight: 1 }}
        >
          ›
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 3 }}>
        {DIAS_SEMANA.map((d) => (
          <div key={d} style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: PALETTE.cardMuted }}>
            {d}
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, maxWidth: 220, margin: "0 auto" }}>
        {cells.map((day, i) => {
          if (day === null) return <div key={`empty-${i}`} />;
          const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const bookable = isDateBookable(dateStr);
          const isSelected = dateStr === selectedDate;
          const isToday = dateStr === todayStr;
          return (
            <button
              key={dateStr}
              type="button"
              disabled={!bookable}
              onClick={() => onSelect(dateStr)}
              style={{
                aspectRatio: "1 / 1",
                borderRadius: 6,
                fontSize: 11,
                fontWeight: isToday ? 800 : 600,
                cursor: bookable ? "pointer" : "not-allowed",
                border: isSelected
                  ? `2px solid ${PALETTE.ocre}`
                  : isToday
                    ? `1px solid ${PALETTE.cardAccent}`
                    : `1px solid ${PALETTE.cardBorder}`,
                background: isSelected ? PALETTE.ocre + "33" : "transparent",
                color: !bookable ? PALETTE.cardMuted : PALETTE.cardText,
                opacity: bookable ? 1 : 0.4,
              }}
            >
              {day}
            </button>

          );
        })}
      </div>

      <div style={{ fontSize: 11.5, color: PALETTE.cardMuted, marginTop: 8 }}>
        Solo puedes reservar entre hoy y los próximos {BOOKING_WINDOW_DAYS} días.
      </div>
    </div>
  );
}

function ConfirmModal({ slot, onConfirm, onCancel, balance }) {
  const facility = FACILITIES.find((f) => f.id === slot.facilityId);
  const pricing = PRICING[facility.group];

  const [people, setPeople] = useState(1);
  const [duration, setDuration] = useState(pricing.type === "duration" ? pricing.options[0].key : null);
  const [tierCounts, setTierCounts] = useState(() => {
    if (pricing.type !== "tier") return {};
    const init = {};
    pricing.options.forEach((o, i) => { init[o.key] = i === 0 ? 1 : 0; });
    return init;
  });

  let breakdown = [];
  let total = 0;
  let durationLabel = null;

  if (pricing.type === "flat") {
    total = people * pricing.price;
    breakdown = [{ label: `${people} × ${pricing.unitLabel} (${fmtPrice(pricing.price)})`, amount: total }];
  } else if (pricing.type === "tier") {
    breakdown = pricing.options
      .filter((o) => tierCounts[o.key] > 0)
      .map((o) => ({ label: `${tierCounts[o.key]} × ${o.label} (${fmtPrice(o.price)})`, amount: tierCounts[o.key] * o.price }));
    total = breakdown.reduce((sum, b) => sum + b.amount, 0);
  } else if (pricing.type === "duration") {
    const opt = pricing.options.find((o) => o.key === duration);
    durationLabel = opt.label;
    total = people * opt.price;
    breakdown = [{ label: `${people} × ${pricing.unitLabel}, ${opt.label} (${fmtPrice(opt.price)})`, amount: total }];
  }

  const canConfirm = total > 0;
  const hasEnoughBalance = balance >= total;
  const [paymentMethod, setPaymentMethod] = useState(hasEnoughBalance ? "monedero" : "kiosko");

  useEffect(() => {
    if (paymentMethod === "monedero" && !hasEnoughBalance) setPaymentMethod("kiosko");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [hasEnoughBalance]);

  function numberField(label, value, onChange) {
    return (
      <label style={{ fontSize: 13, fontWeight: 600, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
        {label}
        <input
          type="number"
          min={0}
          value={value}
          onChange={(e) => onChange(Math.max(0, parseInt(e.target.value || "0", 10)))}
          style={{ width: 64, padding: "6px 8px", borderRadius: 6, border: `1px solid ${PALETTE.cardBorder}`, fontSize: 14, background: "#FFFFFF", color: PALETTE.cardText }}
        />
      </label>
    );
  }

  return (
    <div
      style={{
        position: "fixed", inset: 0, background: "rgba(11,37,48,0.55)",
        display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 60,
        overflowY: "auto",
      }}
    >
      <div style={{ background: PALETTE.card, color: PALETTE.cardText, borderRadius: 14, padding: 26, maxWidth: 380, width: "100%" }}>
        <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 1, marginBottom: 10 }}>
          CONFIRMAR RESERVA
        </div>
        <p style={{ fontSize: 14, lineHeight: 1.5, marginBottom: 14 }}>
          <strong>{facility.label}</strong><br />
          {slot.date} · {formatHourLabel(slot.hour)} – {formatHourLabel(slot.hour + (SLOT_DURATION[facility.group] || 1))}h
        </p>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
          {pricing.type === "flat" && numberField(`Nº de ${pricing.unitLabel}s`, people, setPeople)}

          {pricing.type === "tier" && pricing.options.map((o) =>
            <div key={o.key}>
              {numberField(`${o.label} (${fmtPrice(o.price)}/${pricing.unitLabel})`, tierCounts[o.key], (v) =>
                setTierCounts((prev) => ({ ...prev, [o.key]: v }))
              )}
            </div>
          )}

          {pricing.type === "duration" && (
            <>
              <div style={{ display: "flex", gap: 8 }}>
                {pricing.options.map((o) => (
                  <button
                    key={o.key}
                    type="button"
                    onClick={() => setDuration(o.key)}
                    style={{
                      flex: 1, padding: "8px 6px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                      border: duration === o.key ? `2px solid ${PALETTE.cardAccent}` : `1px solid ${PALETTE.cardBorder}`,
                      background: duration === o.key ? PALETTE.bgSoft : "transparent",
                      color: duration === o.key ? PALETTE.text : PALETTE.cardText,
                    }}
                  >
                    {o.label}<br />{fmtPrice(o.price)}/{pricing.unitLabel}
                  </button>
                ))}
              </div>
              {numberField(`Nº de ${pricing.unitLabel}s`, people, setPeople)}
            </>
          )}
        </div>

        <div style={{ background: PALETTE.bgSoft, color: PALETTE.text, borderRadius: 8, padding: "10px 14px", marginBottom: 14 }}>
          {breakdown.map((b, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: PALETTE.muted }}>
              <span>{b.label}</span><span>{fmtPrice(b.amount)}</span>
            </div>
          ))}
          <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 15, marginTop: 6, borderTop: "1px solid rgba(255,255,255,0.14)", paddingTop: 6 }}>
            <span>Total</span><span>{fmtPrice(total)}</span>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: PALETTE.cardAccent, textTransform: "uppercase", letterSpacing: 0.5 }}>
            Forma de pago
          </div>
          <button
            type="button"
            onClick={() => hasEnoughBalance && setPaymentMethod("monedero")}
            disabled={!hasEnoughBalance}
            style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", borderRadius: 8, textAlign: "left",
              border: paymentMethod === "monedero" ? `2px solid ${PALETTE.marisma}` : "1px solid rgba(255,255,255,0.18)",
              background: paymentMethod === "monedero" ? "rgba(99,180,129,0.16)" : "transparent",
              cursor: hasEnoughBalance ? "pointer" : "not-allowed",
              opacity: hasEnoughBalance ? 1 : 0.55,
            }}
          >
            <span style={{ fontSize: 13.5, fontWeight: 600 }}>Monedero (saldo: {fmtEuro(balance)})</span>
            {!hasEnoughBalance && <span style={{ fontSize: 11.5, color: PALETTE.averia, fontWeight: 700 }}>Saldo insuficiente</span>}
          </button>
          <button
            type="button"
            onClick={() => setPaymentMethod("kiosko")}
            style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "10px 14px", borderRadius: 8, textAlign: "left",
              border: paymentMethod === "kiosko" ? `2px solid ${PALETTE.cardAccent}` : `1px solid ${PALETTE.cardBorder}`,
              background: paymentMethod === "kiosko" ? PALETTE.bgSoft : "transparent",
              color: paymentMethod === "kiosko" ? PALETTE.text : PALETTE.cardText,
              cursor: "pointer",
            }}
          >
            <span style={{ fontSize: 13.5, fontWeight: 600 }}>
              {facility.group === "karting" ? "Pagar en el karting (efectivo o tarjeta)" : "Pagar en el kiosko"}
            </span>
          </button>
        </div>

        <p style={{ fontSize: 12.5, color: PALETTE.cardMuted, marginBottom: 16 }}>
          {paymentMethod === "monedero"
            ? `Se descontará ${fmtEuro(total)} de tu monedero al confirmar. Puedes cancelar hasta 24h antes y se te devolverá el saldo.`
            : facility.group === "karting"
              ? "El pago se realiza directamente en el karting (aceptan efectivo y tarjeta) antes de empezar. Puedes cancelar hasta 24h antes de la hora reservada."
              : "El pago se realiza en el kiosko del polideportivo antes de empezar. Puedes cancelar hasta 24h antes de la hora reservada."}
        </p>

        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onCancel} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${PALETTE.cardBorder}`, background: PALETTE.card, color: PALETTE.cardText, fontWeight: 600, cursor: "pointer" }}>
            Cancelar
          </button>
          <button
            onClick={() => canConfirm && onConfirm({ breakdown, total, durationLabel }, paymentMethod)}
            disabled={!canConfirm}
            style={{
              flex: 1, padding: "10px 0", borderRadius: 8, border: "none", fontWeight: 700,
              cursor: canConfirm ? "pointer" : "not-allowed",
              background: canConfirm ? PALETTE.ocre : PALETTE.cardMutedBg,
              color: canConfirm ? PALETTE.atlanticoOscuro : PALETTE.cardMuted,
            }}
          >
            Confirmar
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   MIS RESERVAS
--------------------------------------------------------- */
function MyBookings({ bookings, onCancel, balance }) {
  const sorted = [...bookings].sort((a, b) => (a.date + a.hour).localeCompare(b.date + b.hour));
  return (
    <div style={{ maxWidth: 700, margin: "0 auto", padding: "24px 20px 40px", width: "100%" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
        <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, letterSpacing: 1, margin: 0 }}>MIS RESERVAS</h2>
        <span style={{ fontSize: 13.5, fontWeight: 700, color: PALETTE.marisma }}>Saldo del monedero: {fmtEuro(balance)}</span>
      </div>
      <p style={{ fontSize: 12.5, color: PALETTE.muted, marginBottom: 16 }}>
        Puedes cancelar cualquier reserva hasta {CANCEL_WINDOW_HOURS}h antes de la hora reservada. Si la pagaste con el monedero, el importe se te devuelve automáticamente.
      </p>
      {sorted.length === 0 && <p style={{ color: PALETTE.muted }}>Aún no tienes reservas. Ve a "Reservar" para elegir pista y hora.</p>}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {sorted.map((b) => {
          const cancellable = hoursUntil(b.date, b.hour) >= CANCEL_WINDOW_HOURS;
          return (
            <div key={b.id} style={{ background: PALETTE.card, color: PALETTE.cardText, borderRadius: 10, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 2px 8px rgba(18,56,71,0.06)", gap: 10, flexWrap: "wrap" }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{b.facilityLabel}</div>
                <div style={{ fontSize: 13, color: PALETTE.cardMuted }}>
                  {b.date} · {formatHourLabel(b.hour)}h{b.durationLabel ? ` · ${b.durationLabel}` : ""}
                </div>
                {typeof b.total === "number" && (
                  <div style={{ fontSize: 13, fontWeight: 700, color: PALETTE.cardAccent, marginTop: 2 }}>
                    {fmtEuro(b.total)} · {b.paymentMethod === "monedero" ? "pagado con monedero" : b.facilityId === "karting" ? "pago en el karting" : "pago en kiosko"}
                  </div>
                )}
                {!cancellable && (
                  <div style={{ fontSize: 11.5, color: PALETTE.averia, fontWeight: 700, marginTop: 3 }}>
                    Ya no se puede cancelar (menos de {CANCEL_WINDOW_HOURS}h)
                  </div>
                )}
              </div>
              <button
                onClick={() => cancellable && onCancel(b.id)}
                disabled={!cancellable}
                style={{
                  background: "none",
                  border: `1px solid ${cancellable ? PALETTE.averia : PALETTE.cardBorder}`,
                  color: cancellable ? PALETTE.averia : PALETTE.cardMuted,
                  borderRadius: 8, padding: "7px 14px", fontWeight: 600,
                  cursor: cancellable ? "pointer" : "not-allowed", fontSize: 13,
                }}
              >
                Cancelar
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

   FOOTER
--------------------------------------------------------- */
/* ---------------------------------------------------------
   PANEL DE ADMINISTRACIÓN
--------------------------------------------------------- */
function AdminPanel({ isFacilityActive, onToggle, bookings, users, onAddBalance, walletTx }) {
  const today = fmtDate(new Date());
  const reservasHoy = bookings.filter((b) => b.date === today).length;

  return (
    <div style={{ maxWidth: 800, margin: "0 auto", padding: "24px 20px 40px", width: "100%" }}>
      <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, letterSpacing: 1, marginBottom: 4 }}>
        PANEL DE ADMINISTRACIÓN
      </h2>
      <p style={{ fontSize: 13, color: PALETTE.muted, marginBottom: 20 }}>
        {reservasHoy} reserva{reservasHoy === 1 ? "" : "s"} para hoy · {bookings.length} en total.
      </p>

      <WalletAdminSection users={users} onAddBalance={onAddBalance} walletTx={walletTx} />

      {GROUPS.map((g) => (
        <div key={g.id} style={{ marginBottom: 22 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8, color: PALETTE.atlantico }}>{g.label}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {FACILITIES.filter((f) => f.group === g.id).map((f) => {
              const active = isFacilityActive(f.id);
              return (
                <div
                  key={f.id}
                  style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                    background: PALETTE.card, color: PALETTE.cardText, borderRadius: 10, padding: "12px 16px",
                    boxShadow: "0 2px 8px rgba(18,56,71,0.06)",
                  }}
                >
                  <span style={{ fontWeight: 600, fontSize: 14 }}>{f.label}</span>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 12.5, fontWeight: 700, color: active ? PALETTE.marisma : PALETTE.averia }}>
                      {active ? "EN SERVICIO" : "AVERÍA"}
                    </span>
                    <button
                      onClick={() => onToggle(f.id)}
                      style={{
                        border: "none", borderRadius: 20, padding: "7px 14px", fontSize: 12.5, fontWeight: 600,
                        cursor: "pointer",
                        background: active ? PALETTE.averia : PALETTE.marisma,
                        color: "white",
                      }}
                    >
                      {active ? "Marcar avería" : "Poner en servicio"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN · MONEDERO DE USUARIOS
--------------------------------------------------------- */
function WalletAdminSection({ users, onAddBalance, walletTx }) {
  const [selected, setSelected] = useState(users[0]?.username || "");
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");

  function submit() {
    const val = parseFloat((amount || "0").replace(",", "."));
    if (!selected || !val || val <= 0) return;
    onAddBalance(selected, Math.round(val * 100) / 100, note);
    setAmount("");
    setNote("");
  }

  const recentTx = [...walletTx].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);

  if (users.length === 0) {
    return (
      <div style={{ marginBottom: 30 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8, color: PALETTE.atlantico }}>Monedero de usuarios</div>
        <div style={{ background: PALETTE.card, borderRadius: 10, padding: 16, boxShadow: "0 2px 8px rgba(18,56,71,0.06)", fontSize: 13, color: PALETTE.cardMuted }}>
          Todavía no hay usuarios registrados con cuenta propia.
        </div>
      </div>
    );
  }

  return (
    <div style={{ marginBottom: 30 }}>
      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8, color: PALETTE.atlantico }}>Monedero de usuarios</div>

      <div style={{ background: PALETTE.card, color: PALETTE.cardText, borderRadius: 10, padding: 16, boxShadow: "0 2px 8px rgba(18,56,71,0.06)", marginBottom: 14 }}>
        <div style={{ fontSize: 12.5, color: PALETTE.cardMuted, marginBottom: 10 }}>
          Registra aquí el efectivo que recibas en el kiosko para añadirlo al monedero del usuario.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <label style={{ fontSize: 12.5, fontWeight: 600, display: "flex", flexDirection: "column", gap: 5, flex: "1 1 160px" }}>
            Usuario
            <select
              value={selected}
              onChange={(e) => setSelected(e.target.value)}
              style={{ padding: "9px 10px", borderRadius: 8, border: `1px solid ${PALETTE.cardBorder}`, fontSize: 13.5, background: "#FFFFFF", color: PALETTE.cardText }}
            >
              {users.map((u) => (
                <option key={u.username} value={u.username} style={{ background: "#FFFFFF", color: PALETTE.cardText }}>
                  {u.name} (@{u.username}) · {fmtEuro(u.balance || 0)}
                </option>
              ))}
            </select>
          </label>
          <label style={{ fontSize: 12.5, fontWeight: 600, display: "flex", flexDirection: "column", gap: 5, width: 110 }}>
            Importe (€)
            <input
              type="text"
              inputMode="decimal"
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
              placeholder="10,00"
              style={{ padding: "9px 10px", borderRadius: 8, border: `1px solid ${PALETTE.cardBorder}`, fontSize: 13.5, background: "#FFFFFF", color: PALETTE.cardText }}
            />
          </label>
          <label style={{ fontSize: 12.5, fontWeight: 600, display: "flex", flexDirection: "column", gap: 5, flex: "1 1 160px" }}>
            Nota (opcional)
            <input
              type="text"
              value={note}
              onChange={(e) => setNote(e.target.value)}
              placeholder="Ingreso en efectivo"
              style={{ padding: "9px 10px", borderRadius: 8, border: `1px solid ${PALETTE.cardBorder}`, fontSize: 13.5, background: "#FFFFFF", color: PALETTE.cardText }}
            />
          </label>
          <button
            onClick={submit}
            style={{ padding: "10px 18px", borderRadius: 8, border: "none", background: PALETTE.marisma, color: "white", fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}
          >
            Añadir saldo
          </button>
        </div>
      </div>

      {recentTx.length > 0 && (
        <div style={{ background: PALETTE.card, color: PALETTE.cardText, borderRadius: 10, padding: 16, boxShadow: "0 2px 8px rgba(18,56,71,0.06)" }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: PALETTE.cardAccent, marginBottom: 8 }}>Movimientos recientes</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {recentTx.map((tx) => (
              <div key={tx.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: PALETTE.cardMuted, borderBottom: `1px solid ${PALETTE.cardBorder}`, paddingBottom: 6 }}>
                <span>
                  {tx.type === "topup" ? "Ingreso" : tx.type === "refund" ? "Reembolso" : "Cobro reserva"} · @{tx.username}
                  {tx.note ? ` · ${tx.note}` : ""}
                </span>
                <span style={{ fontWeight: 700, color: tx.amount >= 0 ? PALETTE.marisma : PALETTE.averia }}>
                  {tx.amount >= 0 ? "+" : ""}{fmtEuro(tx.amount)}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function Footer() {
  return (
    <footer style={{ marginTop: "auto", background: PALETTE.bgSoft, borderTop: `3px solid ${PALETTE.blueDeep}`, color: PALETTE.muted, padding: "18px 20px", fontSize: 12.5, textAlign: "center" }}>
      <div>Polideportivo Municipal de Matalascañas · Pago exclusivamente en el kiosko · Horario de pistas: 09:00–23:00</div>
      <a
        href="https://www.makers3d.es"
        target="_blank"
        rel="noopener noreferrer"
        style={{
          display: "inline-flex", alignItems: "center", gap: 8, marginTop: 10,
          textDecoration: "none", color: PALETTE.muted, fontSize: 12,
          padding: "5px 12px", borderRadius: 20, border: `1px solid ${PALETTE.cardLine}`,
        }}
      >
        <svg width="18" height="18" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="36" height="36" rx="9" fill={PALETTE.card} stroke={PALETTE.blueDeep} strokeWidth="2" />
          <path d="M12 27V13l8 6 8-6v14" stroke={PALETTE.blue} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
        <span>Web realizada por <strong style={{ color: PALETTE.blue, fontWeight: 800 }}>Makers3D.es</strong></span>
      </a>
    </footer>
  );
}
